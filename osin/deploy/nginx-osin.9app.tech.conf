# Mẫu nginx cho Osin ở TÊN MIỀN RIÊNG osin.9app.tech (cookie của 9app.tech không gửi sang đây).
# Đặt vào includes/ cùng các site khác; cần chứng chỉ riêng cho osin.9app.tech (hoặc chứng chỉ wildcard) và bản ghi DNS A/AAAA trỏ về máy chủ.
# Container: 9osin (mạng ops_tms-network), cổng nội bộ 8103, BASE_PATH rỗng.

server {
    listen 80;
    server_name osin.9app.tech;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://osin.9app.tech$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name osin.9app.tech;

    ssl_certificate     /etc/letsencrypt/live/osin.9app.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/osin.9app.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    charset utf-8;
    client_max_body_size 64k;
    # Không ghi nội dung hội thoại vào log truy cập: Osin không đưa nội dung vào URL, nhưng giữ log gọn
    access_log /var/log/nginx/osin.access.log main;

    # Hai nhóm đường dẫn chỉ dành cho mạng nội bộ: KHÔNG bao giờ mở ra internet
    location ^~ /internal/    { return 404; }
    location ^~ /admin-api/   { return 404; }   # 9app Console gọi thẳng http://9osin:8103/admin-api/v1 trong mạng docker

    location / {
        set $osin_upstream http://9osin:8103;
        proxy_pass $osin_upstream;
        resolver 127.0.0.11 valid=10s;          # DNS nội bộ của docker
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # Osin lấy IP từ phần tử CUỐI (TRUSTED_PROXY_HOPS=1)
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 90s;                 # một lượt AI có thể tới 60 giây
        proxy_buffering off;
        # Không thêm CORS ở đây. Không dùng sub_filter.
    }
}
