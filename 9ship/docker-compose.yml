# 9Ship: dịch vụ + PostgreSQL. Dùng chung mạng với nginx của 9app.tech để proxy_pass http://9ship:8099.
# Chạy: cp .env.example .env  (điền giá trị)  &&  docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ship
      POSTGRES_PASSWORD: ${DB_PASSWORD:?đặt DB_PASSWORD trong .env}
      POSTGRES_DB: ship
    volumes:
      - ship-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ship -d ship"]
      interval: 5s
      timeout: 3s
      retries: 20
  9ship:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://ship:${DB_PASSWORD}@db:5432/ship
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8099:8099"
volumes:
  ship-db:
