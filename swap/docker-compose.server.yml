# Triển khai 9swap lên máy chủ dùng chung. Dùng lại PostgreSQL của 9Ship (container 9ship-db) với CSDL "swap" và vai trò riêng.
# Chuẩn bị một lần: tạo vai trò + CSDL (xem README), rồi:
#   cp .env.example .env && docker compose -f docker-compose.server.yml up -d --build
name: 9swap
services:
  swap:
    build: .
    image: 9swap:latest
    container_name: 9swap
    restart: unless-stopped
    env_file: .env
    mem_limit: 160m
    networks: [shipdb, tms]
networks:
  shipdb:
    external: true
    name: 9ship_internal
  tms:
    external: true
    name: ops_tms-network
