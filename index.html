<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="9app">
<meta name="description" content="Không gian của bạn — việc hôm nay, giấy tờ, nhà, xe, gia đình.">
<title>9app</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/mark.svg?v=17" type="image/svg+xml"><link rel="apple-touch-icon" href="icons/mark.svg?v=17"><link rel="stylesheet" href="css/style.css?v=17"><link rel="stylesheet" href="css/os.css?v=17">
</head>
<body>
<svg class="svg-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
<symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 9a6 6 0 1 1 12 0c0 7 3 7 3 9H3c0-2 3-2 3-9"/><path d="M10 21a2 2 0 0 0 4 0"/></symbol>
<symbol id="i-home" viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1z"/></symbol>
<symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1.4"/><rect x="14" y="4" width="6" height="6" rx="1.4"/><rect x="4" y="14" width="6" height="6" rx="1.4"/><rect x="14" y="14" width="6" height="6" rx="1.4"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.2"/><path d="M5 19c.8-3.4 3.2-5 7-5s6.2 1.6 7 5"/></symbol>
</defs></svg>

<template id="banner-tpl">
<section class="banner" id="banner">
<div class="banner-copy">
<div class="banner-kicker">KHÔNG GIAN CỦA BẠN</div>
<h1>Mọi thứ của bạn, một chỗ</h1>
<p>Việc hôm nay, giấy tờ, nhà, xe, gia đình.</p>
<button class="banner-cta" id="btn-discover" type="button">Khám phá ngay</button>
</div>
<svg class="banner-art" viewBox="0 0 180 130" aria-hidden="true">
<rect x="92" y="8" width="36" height="36" rx="10" fill="#38BDF8"/>
<rect x="128" y="22" width="42" height="42" rx="12" fill="#60A5FA"/>
<path d="M141 36h16M149 28v16" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/>
<rect x="70" y="42" width="40" height="40" rx="11" fill="#F472B6"/>
<circle cx="83" cy="56" r="5" fill="#fff"/><circle cx="97" cy="56" r="5" fill="#fff"/><path d="M78 72c2-6 8-8 12-8s10 2 12 8" fill="none" stroke="#fff" stroke-width="2.4"/>
<rect x="112" y="62" width="40" height="40" rx="11" fill="#34D399"/>
<rect x="84" y="86" width="28" height="28" rx="8" fill="#FB923C"/>
</svg>
<div class="banner-mark">9app</div>
<div class="banner-dots" aria-hidden="true"><span class="on"></span><span></span><span></span></div>
</section>
</template>

<div id="phone" class="workspace">
<header class="top">
<a class="brand" href="#/" aria-label="9app — Trang chủ"><img src="icons/mark.svg?v=17" width="32" height="32" alt=""><span>app</span></a>
<label class="search"><svg class="icon" aria-hidden="true"><use href="#i-search"/></svg><span class="visually">Tìm</span><input id="search" type="search" placeholder="Tìm việc, giấy tờ, ứng dụng…" autocomplete="off" enterkeyhint="search"></label>
<button class="round-btn" id="btn-bell" type="button" aria-label="Thông báo"><svg class="icon" aria-hidden="true"><use href="#i-bell"/></svg><span class="dot-badge" id="bell-dot" hidden></span></button>
<button class="round-btn tb" id="btn-account" type="button" aria-label="Tài khoản">TB</button>
</header>

<main class="main" id="stage"></main>

<nav class="tabbar" aria-label="Điều hướng">
<button class="tab on" id="tab-home" type="button"><svg class="icon"><use href="#i-home"/></svg>Hôm nay</button>
<button class="tab" id="tab-lib" type="button"><svg class="icon"><use href="#i-grid"/></svg>Thư viện</button>
<button class="tab-plus" id="btn-add" type="button" aria-label="Thêm nhanh"><span>+</span></button>
<button class="tab" id="tab-bell" type="button"><svg class="icon"><use href="#i-bell"/></svg>Thông báo</button>
<button class="tab" id="tab-user" type="button"><svg class="icon"><use href="#i-user"/></svg>Tài khoản</button>
</nav>
</div>

<p class="toast" id="toast" role="status" hidden></p>
<div class="sheet-backdrop" id="act-backdrop" hidden></div>
<aside class="sheet act" id="act" hidden role="dialog" aria-modal="true" aria-labelledby="act-name">
<h2 class="act-name" id="act-name">Thêm nhanh</h2>
<div id="act-body"></div>
<button type="button" class="ghost" id="act-cancel">Đóng</button>
</aside>
<script src="js/catalog.js?v=17"></script>
<script src="js/graph.js?v=17"></script>
<script src="js/engine.js?v=17"></script>
<script src="js/id.js?v=17"></script>
<script src="js/os.js?v=17"></script>
</body>
</html>
