# 9app.tech — launcher tĩnh + 9speed ở /speed/ + 9pick ở /9pick/ + 9quy ở /9quy/
# File riêng trong includes/. Không sửa nginx.conf, không đụng
# 9log.tech / 9hrm / 9pick / k77htk / legacyfic / các site khác.
#
# HTTP (cổng 80) phục vụ đúng nội dung: WebView màn ô tô cũ không tin
# Let's Encrypt (Root YR / ISRG X1). Chỉ 9app.tech — site khác vẫn 301 HTTPS.

server {
    listen 80;
    server_name 9app.tech www.9app.tech;

    charset utf-8;
    root /var/www/certbot/9app;
    index index.html;
    client_max_body_size 20m;
    access_log /var/log/nginx/9app.access.log main;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    if ($host = www.9app.tech) {
        return 301 http://9app.tech$request_uri;
    }

    location ~* \.webmanifest$ {
        default_type application/manifest+json;
    }

    location ^~ /speed/data/ {
        add_header Accept-Ranges bytes;
        try_files $uri =404;
    }

    location ^~ /speed/ {
        try_files $uri $uri/ /speed/index.html;
    }

    include /etc/nginx/includes/9app.gates.inc;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name 9app.tech www.9app.tech;

    ssl_certificate     /etc/letsencrypt/live/9app.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/9app.tech/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES128-SHA:AES128-SHA256:AES128-SHA;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    charset utf-8;
    root /var/www/certbot/9app;
    index index.html;
    client_max_body_size 20m;
    access_log /var/log/nginx/9app.access.log main;

    if ($host = www.9app.tech) {
        return 301 https://9app.tech$request_uri;
    }

    location ~* \.webmanifest$ {
        default_type application/manifest+json;
    }

    location ^~ /speed/data/ {
        add_header Accept-Ranges bytes;
        try_files $uri =404;
    }

    location ^~ /speed/ {
        try_files $uri $uri/ /speed/index.html;
    }

    include /etc/nginx/includes/9app.gates.inc;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
