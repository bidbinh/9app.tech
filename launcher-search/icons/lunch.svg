    <path d="M190 150c-16 22 16 34 0 58"/>
    <path d="M256 128c-16 22 16 34 0 58"/>
  </g>
  <!-- đũa -->
  <g stroke="#ffe9a8" stroke-width="15" stroke-linecap="round" filter="url(#sh)">
    <path d="M318 96L372 252"/>
    <path d="M350 86L412 244"/>
  </g>
