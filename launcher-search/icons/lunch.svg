  <!-- bát -->
  <g filter="url(#sh)"><path d="M112 262h288c0 86-60 140-144 140s-144-54-144-140z" fill="url(#bowl)"/></g>
  <path d="M170 322c20 22 52 34 86 34" fill="none" stroke="#f5513a" stroke-width="12" stroke-linecap="round" opacity=".55"/>
  <rect x="196" y="398" width="120" height="22" rx="11" fill="#ffe6dc"/>
