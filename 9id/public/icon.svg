<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset=".55" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#134e4a"/>
    </linearGradient>
    <radialGradient id="glow" cx=".2" cy=".05" r=".9">
      <stop offset="0" stop-color="#fff" stop-opacity=".38"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d9f5f0"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#042f2c" flood-opacity=".4"/></filter>
  </defs>
  <rect width="512" height="512" rx="114" fill="url(#bg)"/>
  <rect width="512" height="512" rx="114" fill="url(#glow)"/>
  <!-- thẻ tài khoản -->
  <g filter="url(#sh)">
    <rect x="76" y="124" width="360" height="264" rx="38" fill="url(#card)"/>
  </g>
  <!-- người -->
  <circle cx="176" cy="226" r="40" fill="#0f766e"/>
  <path d="M104 344c0-44 32-74 72-74s72 30 72 74z" fill="#0f766e"/>
  <!-- số 9 -->
  <text x="352" y="268" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="124" fill="#0f766e">9</text>
  <g stroke="#7fd1c6" stroke-width="12" stroke-linecap="round" fill="none">
    <path d="M296 312h112"/>
    <path d="M296 348h72"/>
  </g>
</svg>
