<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; media-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f6f4f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17151a" media="(prefers-color-scheme: dark)">
<meta name="description" content="9draw - Vẽ tay nhanh trên điện thoại: bút, bút dạ, tẩy, nhiều màu; lưu ảnh và chia sẻ lên mạng xã hội. Chạy trên máy bạn, không thu thập dữ liệu.">
<title>Vẽ tay - 9draw</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="9draw">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<svg class="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-pen" viewBox="0 0 24 24"><path d="M4 20l1-4.2L16.6 4.2a2 2 0 0 1 2.8 0l.4.4a2 2 0 0 1 0 2.8L8.2 19zM14.5 6.3l3.2 3.2"/></symbol>
  <symbol id="i-hl" viewBox="0 0 24 24"><path d="M9 15 4 20h5l1.5-1.5M9 15l7.5-7.5 3.5 3.5L12.5 18.5zM14 4.5l5.5 5.5"/></symbol>
  <symbol id="i-er" viewBox="0 0 24 24"><path d="M8.5 19.5h11M5 14.5l8.6-8.6a2 2 0 0 1 2.8 0l2.2 2.2a2 2 0 0 1 0 2.8L11 19.5H8.3a2 2 0 0 1-1.4-.6L5 17a2 2 0 0 1 0-2.5zM9 10.5l5 5"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 7 4.5 11.5 9 16M5 11.5h9a5 5 0 0 1 0 10h-3"/></symbol>
  <symbol id="i-redo" viewBox="0 0 24 24"><path d="m15 7 4.5 4.5L15 16M19 11.5h-9a5 5 0 0 0 0 10h3"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 15V4M8 8l4-4 4 4M5 13v5.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V13"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M8 11l4 4 4-4M5 19.5h14"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11" height="11" rx="2"/><path d="M15.5 8.5V6A1.5 1.5 0 0 0 14 4.5H6A1.5 1.5 0 0 0 4.5 6v8A1.5 1.5 0 0 0 6 15.5h2.5"/></symbol>
  <symbol id="i-paper" viewBox="0 0 24 24"><rect x="4.5" y="3.5" width="15" height="17" rx="2"/><path d="M4.5 9.5h15M4.5 15h15M10 3.5v17"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 7V4.5h4V7M6.5 7l.8 12a1.5 1.5 0 0 0 1.5 1.4h6.4a1.5 1.5 0 0 0 1.5-1.4l.8-12"/></symbol>
  <symbol id="i-fit" viewBox="0 0 24 24"><path d="M4 9V5.5A1.5 1.5 0 0 1 5.5 4H9M15 4h3.5A1.5 1.5 0 0 1 20 5.5V9M20 15v3.5a1.5 1.5 0 0 1-1.5 1.5H15M9 20H5.5A1.5 1.5 0 0 1 4 18.5V15"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
</svg>

<header class="topbar">
  <a id="ve-9app" class="pill9" href="https://9app.tech/" aria-label="Về 9app"><span aria-hidden="true">‹</span> 9app</a>
  <a class="brand" href="./" aria-label="9draw"><span class="brand-9">9</span><span class="brand-n">draw</span></a>
  <span class="grow"></span>
  <button id="b-undo" class="ib" type="button" aria-label="Hoàn tác" disabled><svg><use href="#i-undo"/></svg></button>
  <button id="b-redo" class="ib" type="button" aria-label="Làm lại" disabled><svg><use href="#i-redo"/></svg></button>
  <button id="b-share" class="cta" type="button"><svg><use href="#i-share"/></svg><span>Xuất ảnh</span></button>
</header>

<main id="stage" class="stage" aria-label="Khung vẽ">
  <div id="page" class="page">
    <canvas id="c-bg" aria-hidden="true"></canvas>
    <canvas id="c-ink" role="img" aria-label="Hình đang vẽ"></canvas>
    <canvas id="c-live" aria-hidden="true"></canvas>
  </div>
  <button id="b-fit" class="fit" type="button" hidden aria-label="Vừa khung"><svg><use href="#i-fit"/></svg><span>Vừa khung</span></button>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</main>

<section class="dock" aria-label="Công cụ">
  <div class="row colors" id="colors" role="radiogroup" aria-label="Màu"></div>
  <div class="row tools">
    <div class="seg" role="radiogroup" aria-label="Công cụ vẽ">
      <button class="tool" type="button" role="radio" data-tool="pen" aria-label="Bút"><svg><use href="#i-pen"/></svg><span>Bút</span></button>
      <button class="tool" type="button" role="radio" data-tool="hl" aria-label="Bút dạ"><svg><use href="#i-hl"/></svg><span>Bút dạ</span></button>
      <button class="tool" type="button" role="radio" data-tool="er" aria-label="Tẩy"><svg><use href="#i-er"/></svg><span>Tẩy</span></button>
    </div>
    <label class="size" aria-label="Cỡ nét">
      <span id="size-dot" class="size-dot"></span>
      <input id="size" type="range" min="2" max="60" step="1">
    </label>
    <button id="b-paper" class="ib sq" type="button" aria-label="Giấy vẽ"><svg><use href="#i-paper"/></svg></button>
    <button id="b-clear" class="ib sq" type="button" aria-label="Xóa hết"><svg><use href="#i-trash"/></svg></button>
  </div>
</section>

<dialog id="d-paper" class="sheet" aria-labelledby="t-paper">
  <div class="sheet-h"><h2 id="t-paper">Giấy vẽ</h2><button class="ib" type="button" data-close aria-label="Đóng"><svg><use href="#i-close"/></svg></button></div>
  <h3>Khổ giấy</h3>
  <div id="fmts" class="chips" role="radiogroup" aria-label="Khổ giấy"></div>
  <h3>Nền</h3>
  <div id="bgs" class="chips" role="radiogroup" aria-label="Nền"></div>
</dialog>

<dialog id="d-out" class="sheet" aria-labelledby="t-out">
  <div class="sheet-h"><h2 id="t-out">Lưu và chia sẻ</h2><button class="ib" type="button" data-close aria-label="Đóng"><svg><use href="#i-close"/></svg></button></div>
  <div class="prev"><img id="prev" alt="Xem trước hình vẽ"></div>
  <div class="acts">
    <button id="o-share" class="cta big" type="button"><svg><use href="#i-share"/></svg><span>Chia sẻ</span></button>
    <button id="o-save" class="btn" type="button"><svg><use href="#i-download"/></svg><span>Lưu ảnh</span></button>
    <button id="o-copy" class="btn" type="button" hidden><svg><use href="#i-copy"/></svg><span>Sao chép</span></button>
  </div>
  <p id="o-note" class="note">Ảnh PNG, rộng 1080 px, đủ nét để đăng Facebook, Zalo, Instagram.</p>
</dialog>

<noscript><p class="nojs">9draw cần bật JavaScript để chạy.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
